[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-pdf-editor"
version = "1.0.0"
description = "Orion — an offline desktop PDF viewer, editor, annotator and page organiser"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["pdf", "editor", "annotation", "desktop", "qt", "pyside6"]
authors = [{ name = "The Orion contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: Editors",
  "Topic :: Office/Business",
]
dependencies = [
  "PySide6>=6.6",
  "pypdfium2>=4.30",
  "pypdf>=4.0",
  "reportlab>=4.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/MarcoLombardoDev/Orion"
Source = "https://github.com/MarcoLombardoDev/Orion"
Issues = "https://github.com/MarcoLombardoDev/Orion/issues"

[project.gui-scripts]
orion = "orion.main:main"

[tool.setuptools.packages.find]
include = ["orion*"]

[tool.setuptools.package-data]
orion = ["../resources/styles/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Both files are declarative tables; one entry per line reads better than a
# wrapped one, and neither contains logic.
"orion/ui/actions.py" = ["E501"]
"orion/ui/icons.py" = ["E501"]
