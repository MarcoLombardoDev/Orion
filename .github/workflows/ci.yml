name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
        exclude:
          # One Python version per non-Linux platform keeps the matrix honest
          # without tripling the runtime; Linux covers the full range.
          - os: windows-latest
            python: "3.10"
          - os: macos-latest
            python: "3.10"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxkbcommon0

      - name: Install Orion
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check orion tests

  layering:
    name: Model layer stays Qt-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The document model, the command history and the utilities must remain
      # importable without Qt. Installing the dependencies *except* PySide6
      # proves it, rather than trusting a convention.
      - name: Install without PySide6
        run: |
          python -m pip install --upgrade pip
          pip install PyMuPDF pypdf Pillow
      - name: Import the framework-neutral layers
        run: |
          python - <<'PY'
          import importlib, sys
          for module in (
              "orion.utils.geometry",
              "orion.utils.events",
              "orion.document",
              "orion.document.serialization",
              "orion.commands",
              "orion.pdf.operations",
              "orion.pdf.writer",
          ):
              importlib.import_module(module)
          assert "PySide6" not in sys.modules, "a lower layer imported Qt"
          print("model, command and engine layers are Qt-free")
          PY
