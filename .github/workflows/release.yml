name: Release binaries

# Builds a standalone Orion for each platform and attaches it to a release.
#
# Publishing a release triggers this automatically.  Run it by hand — passing
# the tag — to attach binaries to a release that already exists.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to attach the binaries to (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            asset: windows-x64
          - os: macos-latest
            label: macOS (arm64)
            asset: macos-arm64
          - os: ubuntu-latest
            label: Linux (x64)
            asset: linux-x64

    steps:
      - name: Work out which tag to build
        id: tag
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            echo "::error::No tag to build; pass one when dispatching this workflow."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxkbcommon0

      - name: Install Orion and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build
        run: pyinstaller --noconfirm --clean orion.spec

      # A bundle that cannot start is worse than no bundle, so it is run before
      # it is offered for download.
      - name: Smoke-test the bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "dist/Orion/Orion.exe" --version'

      - name: Smoke-test the bundle (macOS)
        if: runner.os == 'macOS'
        run: ./dist/Orion/Orion --version

      - name: Smoke-test the bundle (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/Orion/Orion --version

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "Orion-${{ steps.tag.outputs.version }}-${{ matrix.asset }}.zip"
          Compress-Archive -Path dist/Orion/* -DestinationPath $name
          "ASSET=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          name="Orion-${{ steps.tag.outputs.version }}-${{ matrix.asset }}.zip"
          # ditto keeps the symlinks and permissions inside a .app bundle; zip
          # does not, and a flattened bundle will not launch.
          if [ -d "dist/Orion.app" ]; then
            ditto -c -k --keepParent "dist/Orion.app" "$name"
          else
            ditto -c -k --keepParent "dist/Orion" "$name"
          fi
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="Orion-${{ steps.tag.outputs.version }}-${{ matrix.asset }}.tar.gz"
          tar -czf "$name" -C dist Orion
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ steps.tag.outputs.tag }}" "$ASSET" --clobber
